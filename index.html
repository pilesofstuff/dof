<!DOCTYPE html>
<html>
<head>
    <title>Depth of Field and Focus Stacking Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, sans-serif; margin: 16px; line-height: 1.4; }
      .container { max-width: 860px; margin: 0 auto; }
      label { display: inline-block; width: 260px; margin-bottom: 10px; vertical-align: middle; }
      input, select { width: 180px; padding: 8px; }
      button { margin-top: 20px; padding: 12px 20px; cursor: pointer; }
      #result { margin-top: 30px; font-size: 1.1em; }
      .section { margin-bottom: 30px; }

      /* Mobile adjustments */
      @media (max-width: 600px) {
        label { display: block; width: 100%; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; font-size: 16px; }
        button { width: 100%; }
        body { margin: 12px; }
        #result { font-size: 1em; }
      }
    </style>
    </head>
<body>
  <div class="container">
    <h1>Depth of Field and Focus Stacking Calculator</h1>
    <div class="section">
        <h2>Input Parameters</h2>
        <label for="focalLength">Focal Length (mm):</label>
        <input type="number" id="focalLength" value="50" step="0.1"><br>

        <label for="aperture">Aperture (f-number):</label>
        <input type="number" id="aperture" value="11" step="0.1"><br>

        <label for="sensorSize">Sensor Size:</label>
        <select id="sensorSize">
            <option value="43.3">Full Frame (36 x 24 mm)</option>
            <option value="28.4">APS-C (23.6 x 15.7 mm)</option>
            <option value="21.6">Four Thirds (17.3 x 13 mm)</option>
        </select><br>

        <label for="desiredDof">Desired Depth of Field:</label>
        <input type="number" id="desiredDof" value="500" step="1">
        <select id="desiredDofUnit">
            <option value="mm">mm</option>
            <option value="in">inches</option>
            <option value="m">meters</option>
        </select><br>

        <label for="initialGuess">Initial Guess for Subject Distance:</label>
        <input type="number" id="initialGuess" value="5000" step="1">
        <select id="initialGuessUnit">
            <option value="mm">mm</option>
            <option value="in">inches</option>
            <option value="m">meters</option>
        </select><br>

        <label for="outputUnit">Output Unit:</label>
        <select id="outputUnit">
            <option value="mm">mm</option>
            <option value="in">inches</option>
            <option value="m">meters</option>
        </select><br>

        <div id="calculatedDistance" style="font-weight: bold; margin-top: 8px;"></div>
    </div>

    <div class="section">
        <h2>Focus Stacking Parameters</h2>
        <label for="subjectDistance">Working Subject Distance:</label>
        <input type="number" id="subjectDistance" value="50" step="1">
        <select id="subjectDistanceUnit">
            <option value="mm">mm</option>
            <option value="in">inches</option>
            <option value="m">meters</option>
        </select>
        <button type="button" onclick="useCalculatedDistance()">Use calculated distance</button><br>

        <label for="overlapPercentage">Overlap Percentage (%):</label>
        <input type="number" id="overlapPercentage" value="30" step="1"><br>
    </div>

    <button onclick="calculateDoF()">Calculate</button>

    <div id="result"></div>
    <script src="dofcal.js"></script>
  </div>
</body>
</html>
